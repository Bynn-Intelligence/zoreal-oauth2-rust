# Auto-release zoreal-oauth2 on every push to main, the release pattern the
# whole ZOREAL OAuth2 library family follows: bump the patch in Cargo.toml, run
# the checks, package the crate, attest it, push the bump commit and tag back
# to main, publish to crates.io, and cut the GitHub release. The push back uses
# the default GITHUB_TOKEN, which does not retrigger this workflow, and the
# bump commit carries [skip publish] as a second guard.
#
# To ship without cutting a release (docs, CI tweaks), put [skip publish] in
# the commit message.
#
# The version in Cargo.toml is released as it stands while neither crates.io
# nor a tag knows it yet; after that every run bumps the patch first.
#
# Publishes via crates.io trusted publishing bound to the crates-io-publish
# environment: no CARGO_REGISTRY_TOKEN secret, no stored credential.
# crates-io-auth-action exchanges the workflow's OIDC id-token for a
# short-lived publish token that its post-step revokes. The packaged .crate is
# also attested with Sigstore build provenance (verifiable with
# `gh attestation verify`). Requires this repository, this workflow file and
# the environment to be registered as a trusted publisher on crates.io.
name: Publish to crates.io

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions: read-all

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    if: "!contains(github.event.head_commit.message, '[skip publish]')"
    runs-on: ubuntu-latest
    environment: crates-io-publish
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          components: clippy

      - id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          CURRENT=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "zoreal-oauth2") | .version')
          PUBLISHED=$(curl -s -o /dev/null -w '%{http_code}' -A 'zoreal-oauth2-rust release workflow' \
            "https://crates.io/api/v1/crates/zoreal-oauth2/${CURRENT}")
          if [ "$PUBLISHED" = "200" ] || git rev-parse -q --verify "refs/tags/v${CURRENT}" >/dev/null; then
            NEW="${CURRENT%.*}.$(( ${CURRENT##*.} + 1 ))"
            sed -i "0,/^version = \"${CURRENT}\"$/s//version = \"${NEW}\"/" Cargo.toml
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          else
            NEW="${CURRENT}"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${NEW}" >> "$GITHUB_OUTPUT"

      # Builds also refresh the root package's version in Cargo.lock.
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

      - if: steps.bump.outputs.bumped == 'true'
        run: |
          git add Cargo.toml Cargo.lock
          git commit -m "Release v${{ steps.bump.outputs.version }} [skip publish]"

      - run: cargo package --locked

      # Sigstore build provenance over the exact .crate that is uploaded.
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: "target/package/zoreal-oauth2-${{ steps.bump.outputs.version }}.crate"

      - run: |
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin HEAD:main "v${{ steps.bump.outputs.version }}"

      # Trusted publishing: a short-lived token from the workflow's OIDC
      # identity, revoked by the action's post-step.
      - id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - run: gh release create "v${{ steps.bump.outputs.version }}" --title "v${{ steps.bump.outputs.version }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
