[package]
name = "zoreal-oauth2"
version = "0.1.2"
edition = "2024"
rust-version = "1.89"
description = "Sign in with ZOREAL for Rust backends: OAuth 2.0 / OpenID Connect relying-party SDK"
authors = ["ZOREAL"]
license = "MIT"
homepage = "https://zoreal.com"
repository = "https://github.com/Bynn-Intelligence/zoreal-oauth2-rust"
documentation = "https://docs.rs/zoreal-oauth2"
readme = "README.md"
keywords = ["zoreal", "oauth2", "oidc", "openid-connect", "authentication"]
categories = ["authentication", "web-programming"]
include = ["src/**/*.rs", "Cargo.toml", "README.md", "LICENSE", "SECURITY.md"]

[dependencies]
base64 = "0.23"
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "pem", "pkcs8", "std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["form", "http2", "rustls"] }
secrecy = "0.10.3"
serde = { version = "1.0.200", features = ["derive"] }
serde_json = "1.0.120"
thiserror = "2"
tokio = { version = "1.40", features = ["sync"] }
uuid = { version = "1.10", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "time"] }
url = "2"
wiremock = "0.6"

[package.metadata.docs.rs]
all-features = true
